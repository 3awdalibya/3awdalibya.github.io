<style>
:root{--bg:#f2f7f6;--surface:#fff;--ink:#16302f;--muted:#5d7472;--line:#d8e6e3;--g:#5bc56e;--t:#11809a;--brand:#11809a;--o:#e8782a;--y:#f2b21a;--warn:#8a4a10;--warn-soft:#fbe6d4;--bad:#a23b2a;--bad-soft:#f6dcd6;--ok:#1b7a43;--ok-soft:#d9f1df;--soft:#dcedf0;--font:"IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1819;--surface:#162426;--ink:#e6f1ef;--muted:#9ab3b0;--line:#27393b;--brand:#4fb8d0;--warn:#f0b987;--warn-soft:#3b2a1a;--bad:#f0a595;--bad-soft:#41231d;--ok:#7fd49a;--ok-soft:#173620;--soft:#17353c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--font);padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
header.top{background:linear-gradient(135deg,#5bc56e,#11809a);color:#fff;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:max(10px,env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:10}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}.hrow img{width:44px;height:44px;border-radius:50%;border:2px solid #fff}
.hrow h1{font:600 1.1rem/1.35 var(--disp);margin:0}.hrow small{display:block;font:400 .82rem var(--font);opacity:.92}
.clk{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap}
nav{max-width:760px;margin:6px auto 0;display:flex;gap:2px;overflow-x:auto}
nav button{font:inherit;color:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 13px;min-height:44px;cursor:pointer;white-space:nowrap;opacity:.82}
nav button[aria-selected=true]{opacity:1;font-weight:600;border-bottom-color:#f2b21a}
main{max-width:760px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:14px}
h2{font:600 1.05rem var(--disp);margin:0;color:var(--brand)}
.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item{padding:12px 14px;gap:6px}.feed{display:flex;flex-direction:column;gap:10px}
label.l{font-weight:600;font-size:.93rem;display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
button{font:inherit}.go{font-weight:600;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;min-height:46px;cursor:pointer}.go.g{background:var(--g);color:#06301a}.go.sm{min-height:36px;padding:4px 14px}
.ghost,.acts button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 14px;min-height:38px;cursor:pointer}.del{color:var(--bad)!important}
.chips,.acts,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:42px;cursor:pointer}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:0}.msg{min-height:1.3em;font-size:.93rem}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pn{font-weight:600}.date{color:var(--muted);font-size:.88rem}
.tag{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--brand);text-decoration:none}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}.notice.ok{background:var(--ok-soft);color:var(--ok)}.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:1.5px dashed var(--line);border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.login{max-width:420px;margin:0 auto;padding-top:max(40px,env(safe-area-inset-top));text-align:center}.login img{width:96px;height:96px;border-radius:50%;border:3px solid var(--g)}
.login h1{font:700 1.3rem var(--disp);color:var(--brand);margin:12px 0 4px}.login .card{text-align:right;margin-top:18px}
table.gt{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}.gt th{background:var(--brand);color:#fff;text-align:right;padding:8px 10px}.gt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:10px}@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.toast{position:fixed;inset-inline:0;bottom:16px;display:flex;justify-content:center;z-index:80;pointer-events:none}.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px}
</style></head><body>

    const now=Date.now(),v=send?((old&&old.v||0)+1):(old&&old.v||0),vers=(old&&old.versions||[]).slice();
    if(send)vers.push({v,at:now,project:f.project,template:f.template,text:f.text,source:f.source,link:f.link,notes:f.notes});
    const row={...f,image_url:img,state:send?'submitted':'draft',v,versions:vers,submitted_at:send?now:(old&&old.submitted_at||null)};
    if(old)await ok(await sb.from('gitems').update(row).eq('id',old.id));
    else await ok(await sb.from('gitems').insert({...row,uid:S.me.id,author:S.me.name,kind:idea?'idea':'weekly',cycle:idea?null:c.id,slot:idea?null:+d.slot}));
    gClose();await refresh();gToast(send?'أُرسل للمراجعة':'حُفظت المسودة');
  }catch(e){say('#gm',errAr(e),'err')}
}
async function gXlsx(){
  try{
    if(!window.ExcelJS)await new Promise((ok2,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=ok2;s.onerror=no;document.head.appendChild(s)});
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('المعتمد',{views:[{rightToLeft:true,state:'frozen',ySplit:1}]});
    ws.columns=[['الكاتب',16],['المشروع',26],['نوع القالب',16],['النص المعتمد',60],['المصدر',24],['رابط المصدر',30],['رابط الصورة',30],['تاريخ التقديم',14],['تاريخ الاعتماد',14],['حالة النشر',12],['تاريخ النشر',14],['ملاحظات',24]].map(([header,width])=>({header,width}));
    ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF11809A'}};c.alignment={horizontal:'center'}});
    gApprRows().forEach(r=>{const row=ws.addRow([r.author,r.project||'',r.template||'',r.text,r.source||'',r.link||'',r.image_url||'',r.submitted_at?dkey2(r.submitted_at):'',r.approved_at?dkey2(r.approved_at):'',r.status==='published'?'منشور':'غير منشور',r.published_at?dkey2(r.published_at):'',r.notes||'']);row.alignment={vertical:'top',wrapText:true,horizontal:'right'};if(r.status==='published')row.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD2F0D2'}}})});
    const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='المقترحات المعتمدة - جرافيك عودة الحياة.xlsx';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('تعذر إنشاء الملف')}
}
const gcfg=async(k,v)=>{await ok(await sb.from('config').upsert({key:k,value:v}));await refresh()};
Object.assign(ACT,{
  gt(d){S.gt=d.v;S.gf='all';render()},gf(d){S.gf=d.v;render()},gaf(d){S.gaf=d.v;render()},
  gbg(d,t,e){if(e.target===t)gClose()},gclose(){gClose()},
  gnew(){if(!gtpl().length)return gToast('لا توجد قوالب بعد');gOpen(gForm('فكرة جديدة',null,{idea:true}))},
  gedit(d){const it=d.id?gget(d.id):null;gOpen(gForm(it&&it.kind==='idea'?'تعديل الفكرة':'المقترح '+(d.slot||(it&&it.slot)),it,{idea:!!(it&&it.kind==='idea'),slot:d.slot||(it&&it.slot)}))},
  gview(d){gOpen(gDetail(gget(d.id),false))},gopen(d){gOpen(gDetail(gget(d.id),R()==='owner'))},
  gsave(d){return gSaveItem(d,false)},gsend(d){return gSaveItem(d,true)},
  async gdel(d){if(!confirm('حذف المسودة؟'))return;try{await ok(await sb.from('gitems').delete().eq('id',d.id));await refresh()}catch(e){alert(errAr(e))}},
  async gcycle(){const dt=lt(Date.now());const id='w'+dkey(0).replace(/-/g,'');if(!confirm('بدء دورة جديدة؟ سيبدأ الكتّاب بخمس خانات فارغة.'))return;await gcfg('g_cycle',{id,label:'دورة '+pad(dt.getUTCDate())+'/'+pad(dt.getUTCMonth()+1)+'/'+dt.getUTCFullYear()})},
  async gaddtpl(){const v=val('#gnt').trim();if(!v)return;if(gtpl().includes(v))return alert('القالب موجود');await gcfg('g_templates',{list:gtpl().concat([v])})},
  async gdeltpl(d){const l=gtpl().slice();l.splice(+d.i,1);await gcfg('g_templates',{list:l})},
  async gsaveprj(d){const p=gprj(),l=val(d.k==='stopped'?'#gst':'#gac').split('\n').map(s=>s.trim()).filter(Boolean);p[d.k]=[...new Set(l)];await gcfg('g_projects',p)},
  async gdecide(d){
    const it=gget(d.id);if(!it||!it.v)return alert('لم يُرسل المقترح بعد');
    const note=val('#gnw').trim(),internal=val('#gni').trim(),s=d.s;
    if(s==='needs_edit'&&!note)return alert('اكتب ملاحظة التعديل للكاتب');
    const now=Date.now(),hist=(it.history||[]).concat([{at:now,status:s,v:it.v,note}]);
    try{
      await ok(await sb.from('gitems').update({status:s,for_version:it.v,note_to_writer:note||null,decided_at:now,history:hist,approved_at:s==='approved'?(it.approved_at||now):null,published_at:null,published_by:null}).eq('id',it.id));
      if(internal)await ok(await sb.from('gpriv').upsert({item_id:it.id,notes:(S.gp[it.id]||[]).concat([{at:now,text:internal}])}));
      gClose();await refresh();gToast(s==='approved'?'اعتُمد':s==='rejected'?'رُفض':'أُرسل طلب التعديل');
    }catch(e){alert(errAr(e))}
  },
  async gtoweekly(d){
    const it=gget(d.id),c=gcy();if(!c)return alert('ابدأ دورة أولاً');
    const mine=S.gi.filter(x=>x.uid===it.uid&&x.kind==='weekly'&&x.cycle===c.id);
    if(mine.filter(x=>x.template===it.template).length>=3)return alert('لدى الكاتب 3 مقترحات من هذا القالب');
    let slot=0;for(let n=1;n<=5;n++){const e=mine.find(x=>x.slot===n);if(!e||!e.v){slot=n;break}}
    if(!slot)return alert('لدى الكاتب خمسة مقترحات مكتملة');
    const now=Date.now(),ex=mine.find(x=>x.slot===slot);
    try{
      const row={project:it.project,template:it.template,text:it.text,source:it.source,link:it.link,notes:it.notes,image_url:it.image_url,state:'submitted',v:1,versions:[{v:1,at:now,template:it.template,text:it.text,source:it.source}],submitted_at:now,from_idea:it.id};
      if(ex)await ok(await sb.from('gitems').update(row).eq('id',ex.id));else await ok(await sb.from('gitems').insert({...row,uid:it.uid,author:it.author,kind:'weekly',cycle:c.id,slot}));
      await ok(await sb.from('gitems').update({status:'moved',for_version:it.v,decided_at:now}).eq('id',it.id));
      gClose();await refresh();gToast('نُقلت إلى المقترح '+slot);
    }catch(e){alert(errAr(e))}
  },
  async gpub(d,t){try{await ok(await sb.rpc('g_publish',{p_id:d.id,p_pub:t.checked}));await refresh()}catch(e){alert(errAr(e));await refresh()}},
  gxlsx(){return gXlsx()}
});
