<style>
:root{--bg:#f2f7f6;--surface:#fff;--ink:#16302f;--muted:#5d7472;--line:#d8e6e3;--g:#5bc56e;--t:#11809a;--brand:#11809a;--o:#e8782a;--y:#f2b21a;--warn:#8a4a10;--warn-soft:#fbe6d4;--bad:#a23b2a;--bad-soft:#f6dcd6;--ok:#1b7a43;--ok-soft:#d9f1df;--soft:#dcedf0;--font:"IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1819;--surface:#162426;--ink:#e6f1ef;--muted:#9ab3b0;--line:#27393b;--brand:#4fb8d0;--warn:#f0b987;--warn-soft:#3b2a1a;--bad:#f0a595;--bad-soft:#41231d;--ok:#7fd49a;--ok-soft:#173620;--soft:#17353c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--font);padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
header.top{background:linear-gradient(135deg,#5bc56e,#11809a);color:#fff;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:max(10px,env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:10}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}.hrow img{width:44px;height:44px;border-radius:50%;border:2px solid #fff}
.hrow h1{font:600 1.1rem/1.35 var(--disp);margin:0}.hrow small{display:block;font:400 .82rem var(--font);opacity:.92}
.clk{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap}
nav{max-width:760px;margin:6px auto 0;display:flex;gap:2px;overflow-x:auto}
nav button{font:inherit;color:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 13px;min-height:44px;cursor:pointer;white-space:nowrap;opacity:.82}
nav button[aria-selected=true]{opacity:1;font-weight:600;border-bottom-color:#f2b21a}
main{max-width:760px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:14px}
h2{font:600 1.05rem var(--disp);margin:0;color:var(--brand)}
.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item{padding:12px 14px;gap:6px}.feed{display:flex;flex-direction:column;gap:10px}
label.l{font-weight:600;font-size:.93rem;display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
button{font:inherit}.go{font-weight:600;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;min-height:46px;cursor:pointer}.go.g{background:var(--g);color:#06301a}.go.sm{min-height:36px;padding:4px 14px}
.ghost,.acts button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 14px;min-height:38px;cursor:pointer}.del{color:var(--bad)!important}
.chips,.acts,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:42px;cursor:pointer}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:0}.msg{min-height:1.3em;font-size:.93rem}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pn{font-weight:600}.date{color:var(--muted);font-size:.88rem}
.tag{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--brand);text-decoration:none}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}.notice.ok{background:var(--ok-soft);color:var(--ok)}.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:1.5px dashed var(--line);border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.login{max-width:420px;margin:0 auto;padding-top:max(40px,env(safe-area-inset-top));text-align:center}.login img{width:96px;height:96px;border-radius:50%;border:3px solid var(--g)}
.login h1{font:700 1.3rem var(--disp);color:var(--brand);margin:12px 0 4px}.login .card{text-align:right;margin-top:18px}
</style></head><body>

const ROLES={owner:'المنسّق',exec:'المدير التنفيذي',filming:'رئيس التصوير',ops:'متابع الجرافيك',follower:'المتابع',helper:'مساعد المتابع',writer:'كاتب',photographer:'مصوّر',editing:'مدير المونتاج'};
const SHOOT=['owner','exec','filming','photographer','follower','helper'];
const FLAG='<svg viewBox="0 0 30 20" width="21" height="14" role="img" aria-label="علم ليبيا" style="border-radius:2px"><rect width="30" height="20" fill="#000"/><rect width="30" height="5" fill="#e70013"/><rect y="15" width="30" height="5" fill="#239e46"/><circle cx="14.6" cy="10" r="3.6" fill="#fff"/><circle cx="15.9" cy="10" r="3" fill="#000"/><path d="M18.2 8.4l.5 1.1 1.2.1-.9.8.3 1.2-1.1-.6-1.1.6.3-1.2-.9-.8 1.2-.1z" fill="#fff"/></svg>';
const AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const lt=t=>new Date(t+2*3600e3);
const ftime=t=>{const d=lt(t),h=d.getUTCHours();return (h%12||12)+':'+pad(d.getUTCMinutes())+(h<12?' صباحاً':' مساءً')};
const fdt=t=>{const d=lt(t);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const clockTxt=()=>{const d=lt(Date.now());return ftime(Date.now())+' · '+d.getUTCDate()+' '+AR[d.getUTCMonth()]};
setInterval(()=>{const e=$('#clk');if(e)e.textContent=clockTxt()},15000);
const S={me:null,tab:'home',lists:[],cur:null,shot:{},people:[],msg:''};
const mail=u=>String(u).trim().toLowerCase()+'@3awda.app';
const say=(id,t,c)=>{const m=$(id);if(m){m.textContent=t;m.className='msg '+(c||'')}};
const errAr=e=>{const m=(e&&e.message)||'';if(/Invalid login/i.test(m))return 'اسم المستخدم أو الرمز غير صحيح';if(/banned/i.test(m))return 'الحساب موقوف';if(/same password/i.test(m))return 'اختر رمزاً مختلفاً عن الحالي';return m||'حدث خطأ'};
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!p||!p.active){S.msg=!p?'هذا الحساب غير مفعّل في المنصة':'تعذّر تحميل الحساب';return deniedView()}
  S.me=p;if(p.must_change)return changeView(true);
  await loadAll();render();
}
function loginView(){
  $('#app').innerHTML='<div class="login"><img src="'+ICON+'" alt=""><h1>منصة عودة الحياة</h1><div class="hint">بوابة الطاقم الداخلية</div><div class="card"><div><label class="l" for="u">اسم المستخدم</label><input id="u" dir="ltr" autocomplete="username" autocapitalize="off" autocorrect="off"></div><div><label class="l" for="p">الرمز</label><input id="p" type="password" dir="ltr" autocomplete="current-password"></div><div class="bar"><button class="go" id="lg">دخول</button><span class="msg" id="lm" role="status"></span></div></div></div>';
  const go=async()=>{say('#lm','جارٍ الدخول…');const {error}=await sb.auth.signInWithPassword({email:mail($('#u').value),password:$('#p').value});if(error)return say('#lm',errAr(error),'err');boot()};
  $('#lg').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};
}
function deniedView(){$('#app').innerHTML='<div class="login"><img src="'+ICON+'" alt=""><div class="card"><div class="notice">'+esc(S.msg)+'</div><div class="bar"><button class="go" id="lo">تسجيل الخروج</button></div></div></div>';$('#lo').onclick=logout}
async function logout(){await sb.auth.signOut();S.me=null;loginView()}
function changeView(force){
  const body='<div class="card"><h2>'+(force?'اختر رمزك الخاص':'تغيير الرمز')+'</h2>'+(force?'<p class="hint">هذا أول دخول لك. الرمز المبدئي معروف للمنسّق، فاختر رمزاً جديداً لا يعرفه غيرك (6 خانات على الأقل).</p>':'')+'<div><label class="l" for="n1">الرمز الجديد</label><input id="n1" type="password" dir="ltr" autocomplete="new-password"></div><div><label class="l" for="n2">أعد كتابة الرمز</label><input id="n2" type="password" dir="ltr" autocomplete="new-password"></div><div class="bar"><button class="go" id="sv">حفظ</button><span class="msg" id="cm" role="status"></span></div></div>';
  if(force)$('#app').innerHTML='<div class="login"><img src="'+ICON+'" alt=""><h1>أهلاً '+esc(S.me.name)+'</h1>'+body+'</div>';
  else return body;
  bindChange(force);
}
function bindChange(force){
  const b=$('#sv');if(!b)return;
  b.onclick=async()=>{const a=$('#n1').value,c=$('#n2').value;if(a.length<6)return say('#cm','الرمز أقل من 6 خانات','err');if(a!==c)return say('#cm','الرمزان غير متطابقين','err');
    const {error}=await sb.auth.updateUser({password:a});if(error)return say('#cm',errAr(error),'err');await sb.rpc('password_changed');S.me.must_change=false;say('#cm','تم حفظ الرمز','ok');if(force){await loadAll();render()}};
}
const myTabs=()=>{const r=S.me.role,t=[['home','الرئيسية']];if(SHOOT.includes(r))t.push(['lists','قوائم التصوير']);t.push(['acc','حسابي']);if(r==='owner')t.push(['ppl','الأشخاص']);return t};
async function loadAll(){
  if(SHOOT.includes(S.me.role)){
    const [l,s]=await Promise.all([sb.from('lists').select('*').order('date',{ascending:false}),sb.from('shot').select('*')]);
    S.lists=l.data||[];S.shot={};(s.data||[]).forEach(x=>S.shot[x.key]=x);if(!S.cur||!S.lists.some(x=>x.date===S.cur))S.cur=S.lists[0]&&S.lists[0].date;
  }
  if(S.me.role==='owner'){const {data}=await sb.from('profiles').select('*').order('created_at');S.people=data||[]}
}
function render(){
  if(!S.me)return;if(!myTabs().some(t=>t[0]===S.tab))S.tab='home';
  const nav=myTabs().map(([k,l])=>'<button role="tab" aria-selected="'+(S.tab===k)+'" data-tab="'+k+'">'+l+'</button>').join('');
  const v={home:homeView,lists:listsView,acc:accView,ppl:pplView}[S.tab]();
  $('#app').innerHTML='<header class="top"><div class="hrow"><img src="'+ICON+'" alt=""><h1>منصة عودة الحياة<small>'+esc(S.me.name)+' · '+esc(S.me.title||ROLES[S.me.role])+'</small></h1><div class="clk"><span id="clk">'+clockTxt()+'</span>'+FLAG+'</div></div><nav role="tablist">'+nav+'</nav></header><main>'+v+'</main>';
  if(S.tab==='acc')bindChange(false);
}
function homeView(){return '<div class="card"><h2>أهلاً '+esc(S.me.name)+' 👋</h2><p class="hint">دورك في المنصة: <b>'+esc(S.me.title||ROLES[S.me.role])+'</b></p></div><div class="card"><h2>المرحلة الأولى</h2><p class="hint">الدخول والأدوار وقوائم التصوير جاهزة للتجربة. بقية الأقسام تنتقل تباعاً من الصفحات القديمة.</p></div>'}
function accView(){return '<div class="card"><h2>حسابي</h2><div class="top2"><span>الاسم</span><b>'+esc(S.me.name)+'</b></div><div class="top2"><span>اسم المستخدم</span><b dir="ltr">'+esc(S.me.username)+'</b></div><div class="top2"><span>الصفة</span><b>'+esc(S.me.title||ROLES[S.me.role])+'</b></div><div class="acts"><button class="del" data-act="logout">تسجيل الخروج</button></div></div>'+changeView(false)}
const canShot=()=>['owner','filming'].includes(S.me.role);
const shotKey=(d,i)=>d+'__'+i;
function itemCard(date,i,r,sec){
  const k=shotKey(date,sec+i),sh=S.shot[k];const bd=[];
  if(r.perm==='K')bd.push('<span class="tag warn">يلزم التنسيق قبل الوصول</span>');else if(r.perm_ar)bd.push('<span class="tag">'+esc(r.perm_ar)+'</span>');if(r.sens)bd.push('<span class="tag warn">موقع حساس</span>');
  const place=['وسط','شرق','غرب','جنوب'].includes(r.region)?'طرابلس · '+r.region:(r.region||'');
  return '<div class="item" style="'+(sh?'border-color:var(--ok);background:var(--ok-soft)':'')+'"><div class="top2"><span class="pn">'+i+'. '+esc(r.proj)+'</span><span class="hint">'+esc(place)+'</span></div>'+
  (r.idea?'<div><span class="hint">ما نصوّره</span><div class="txt">'+esc(r.idea)+'</div></div>':'')+(r.why?'<div><span class="hint">سبب التصوير</span><div class="txt">'+esc(r.why)+'</div></div>':'')+
  '<div class="chips">'+bd.join('')+(r.map?'<a class="tag" href="'+esc(r.map)+'" target="_blank" rel="noopener">الموقع على الخريطة</a>':'')+'</div>'+
  (r.info?'<div class="acts"><button data-act="info" data-k="'+k+'">'+(S.open&&S.open[k]?'إخفاء المعلومات':'معلومات عن المشروع')+'</button></div>'+(S.open&&S.open[k]?'<div class="notice" style="font-weight:400"><div class="txt">'+esc(r.info).split(' | ').join('\n')+'</div></div>':''):'')+
  (sh?'<div class="notice ok">✓ تم التصوير · '+esc(sh.by_name||'')+' · '+esc(fdt(Date.parse(sh.at)))+'</div>':'')+
  (canShot()?'<div class="acts">'+(sh?'<button class="del" data-act="unshot" data-k="'+k+'">تراجع</button>':'<button class="go g sm" data-act="shot" data-k="'+k+'" data-d="'+date+'" data-p="'+esc(r.proj)+'">تم التصوير</button>')+'</div>':'')+'</div>'
}
function listsView(){
  if(!S.lists.length)return '<div class="empty">لا قوائم بعد.</div>';
  const L=S.lists.find(x=>x.date===S.cur).data;const dailyShot=Object.keys(S.shot).filter(k=>k.startsWith(S.cur+'__d')).length;
  const groups={};(L.prog||[]).forEach((r,i)=>{(groups[r.prog]=groups[r.prog]||[]).push({r,i:i+1})});
  return '<div class="card"><div class="top2"><h2>قائمة التصوير رقم '+esc(L.n)+'</h2><span class="hint">'+esc(L.date)+'</span></div><p class="hint">وقت التصوير تقدّرونه أنتم. صُوّر '+dailyShot+' من '+L.items.length+' في التحديث اليومي.</p><div class="chips">'+S.lists.map(x=>'<button class="chip" aria-pressed="'+(x.date===S.cur)+'" data-act="issue" data-v="'+x.date+'">'+esc(x.date)+'</button>').join('')+'</div></div>'+
  '<h2>التحديث اليومي · '+L.items.length+'</h2><div class="feed">'+L.items.map((r,i)=>itemCard(S.cur,i+1,r,'d')).join('')+'</div>'+
  '<h2>اقتراحات البرامج</h2>'+Object.keys(groups).map(pn=>'<div class="card"><h2>برنامج «'+esc(pn)+'»</h2><div class="feed">'+groups[pn].map(x=>itemCard(S.cur,x.i,x.r,'p')).join('')+'</div></div>').join('');
}
function pplView(){
  const opts=sel=>Object.keys(ROLES).map(r=>'<option value="'+r+'"'+(r===sel?' selected':'')+'>'+ROLES[r]+'</option>').join('');
  return '<div class="card"><h2>إضافة شخص</h2><div class="row2"><div><label class="l" for="nu">اسم المستخدم (إنجليزي)</label><input id="nu" dir="ltr" autocapitalize="off"></div><div><label class="l" for="np">الرمز المبدئي</label><input id="np" dir="ltr"></div></div><div class="row2"><div><label class="l" for="nn">الاسم الظاهر</label><input id="nn"></div><div><label class="l" for="nr">الصلاحيات (الدور)</label><select id="nr">'+opts('writer')+'</select></div></div><div><label class="l" for="nt">الصفة المعروضة <span class="hint">(اختياري، مثل: مدير)</span></label><input id="nt"></div><div class="bar"><button class="go" data-act="addp">إضافة</button><span class="msg" id="pm" role="status"></span></div></div>'+
  '<div class="card"><h2>استيراد البيانات الأولية</h2><p class="hint">مرة واحدة: ينقل قائمة التصوير والإحصائيات من الموقع القديم.</p><div class="bar"><button class="go" data-act="seed">استيراد</button><span class="msg" id="sm" role="status"></span></div></div>'+
  '<h2>الأشخاص ('+S.people.length+')</h2><div class="feed">'+S.people.map(p=>'<div class="item"><div class="top2"><span class="pn">'+esc(p.name)+'</span><span class="tag '+(p.active?'':'warn')+'">'+(p.active?esc(p.title||ROLES[p.role]):'موقوف')+'</span></div><div class="hint" dir="ltr" style="text-align:right">'+esc(p.username)+(p.must_change?' · لم يغيّر رمزه بعد':'')+'</div>'+
  '<div class="row2"><div><label class="l" for="en_'+p.id+'">الاسم</label><input id="en_'+p.id+'" value="'+esc(p.name)+'"></div><div><label class="l" for="er_'+p.id+'">الصلاحيات (الدور)</label><select id="er_'+p.id+'">'+opts(p.role)+'</select></div></div><div><label class="l" for="et_'+p.id+'">الصفة المعروضة</label><input id="et_'+p.id+'" value="'+esc(p.title||'')+'"></div>'+
  '<label class="hint"><input type="checkbox" style="width:auto;min-height:0" id="eo_'+p.id+'"'+(p.outputs?' checked':'')+'> يكتب مخرجات الاجتماعات</label><label class="hint"><input type="checkbox" style="width:auto;min-height:0" id="ea_'+p.id+'"'+(p.active?' checked':'')+'> الحساب فعّال</label>'+
  '<div class="row2"><div><input id="ep_'+p.id+'" dir="ltr" placeholder="رمز جديد (اختياري)"></div><div class="acts"><button data-act="savep" data-id="'+p.id+'">حفظ</button></div></div><span class="msg" id="em_'+p.id+'" role="status"></span></div>').join('')+'</div>'
}
const ACT={
  logout,
  info(d){S.open=S.open||{};S.open[d.k]=!S.open[d.k];render()},
  issue(d){S.cur=d.v;render()},
  async shot(d){const {error}=await sb.from('shot').upsert({key:d.k,date:d.d,proj:d.p,by_id:S.me.id,by_name:S.me.name,at:new Date().toISOString()});if(error)return alert(errAr(error));await loadAll();render()},
  async unshot(d){const {error}=await sb.from('shot').delete().eq('key',d.k);if(error)return alert(errAr(error));await loadAll();render()},
  async addp(){const u=$('#nu').value.trim(),p=$('#np').value,n=$('#nn').value.trim();if(!u||!p||!n)return say('#pm','املأ كل الخانات','err');
    const {error}=await sb.rpc('create_staff',{p_username:u,p_password:p,p_name:n,p_role:$('#nr').value,p_title:$('#nt').value.trim()||null});if(error)return say('#pm',errAr(error),'err');await loadAll();render()},
  async savep(d){const id=d.id;const e=await sb.rpc('update_staff',{p_id:id,p_name:$('#en_'+id).value.trim(),p_role:$('#er_'+id).value,p_active:$('#ea_'+id).checked,p_outputs:$('#eo_'+id).checked,p_title:$('#et_'+id).value.trim()||null});
    if(e.error)return say('#em_'+id,errAr(e.error),'err');const pw=$('#ep_'+id).value;if(pw){const r=await sb.rpc('set_staff_password',{p_id:id,p_password:pw});if(r.error)return say('#em_'+id,errAr(r.error),'err')}
    await loadAll();render();say('#em_'+id,'تم الحفظ','ok')},
  async seed(){say('#sm','جارٍ الاستيراد…');try{const j=await (await fetch('seed.json')).json();
    const c=Object.keys(j.config).map(k=>({key:k,value:j.config[k]}));let r=await sb.from('config').upsert(c);if(r.error)throw r.error;
    const l=Object.keys(j.lists).map(k=>({date:k,data:j.lists[k]}));r=await sb.from('lists').upsert(l);if(r.error)throw r.error;say('#sm','تم الاستيراد','ok');await loadAll()}catch(e){say('#sm',errAr(e),'err')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){S.tab=t.dataset.tab;render();return}const f=ACT[t.dataset.act];if(f)f(t.dataset,t,e)});
boot();
</script></body></html>
