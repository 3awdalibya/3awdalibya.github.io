<style>
:root{--bg:#f2f7f6;--surface:#fff;--ink:#16302f;--muted:#5d7472;--line:#d8e6e3;--g:#5bc56e;--t:#11809a;--brand:#11809a;--o:#e8782a;--y:#f2b21a;--warn:#8a4a10;--warn-soft:#fbe6d4;--bad:#a23b2a;--bad-soft:#f6dcd6;--ok:#1b7a43;--ok-soft:#d9f1df;--soft:#dcedf0;--font:"IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--font);padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
header.top{background:linear-gradient(135deg,#5bc56e,#11809a);color:#fff;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:max(10px,env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:10}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}.hrow img{width:44px;height:44px;border-radius:50%;border:2px solid #fff}
.hrow h1{font:600 1.1rem/1.35 var(--disp);margin:0}.hrow small{display:block;font:400 .82rem var(--font);opacity:.92}
.clk{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap}
nav{max-width:760px;margin:6px auto 0;display:flex;gap:2px;overflow-x:auto}
nav button{font:inherit;color:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 13px;min-height:44px;cursor:pointer;white-space:nowrap;opacity:.82}
nav button[aria-selected=true]{opacity:1;font-weight:600;border-bottom-color:#f2b21a}
main{max-width:760px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:14px}
h2{font:600 1.05rem var(--disp);margin:0;color:var(--brand)}
.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item{padding:12px 14px;gap:6px}.feed{display:flex;flex-direction:column;gap:10px}
label.l{font-weight:600;font-size:.93rem;display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
button{font:inherit}.go{font-weight:600;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;min-height:46px;cursor:pointer}.go.g{background:var(--g);color:#06301a}.go.sm{min-height:36px;padding:4px 14px}
.ghost,.acts button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 14px;min-height:38px;cursor:pointer}.del{color:var(--bad)!important}
.chips,.acts,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:42px;cursor:pointer}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:0}.msg{min-height:1.3em;font-size:.93rem}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pn{font-weight:600}.date{color:var(--muted);font-size:.88rem}
.tag{font-size:.82rem;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--brand);text-decoration:none}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}.notice.ok{background:var(--ok-soft);color:var(--ok)}.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:1.5px dashed var(--line);border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.login{max-width:420px;margin:0 auto;padding-top:max(40px,env(safe-area-inset-top));text-align:center}.login img{width:96px;height:96px;border-radius:50%;border:3px solid var(--g)}
.login h1{font:700 1.3rem var(--disp);color:var(--brand);margin:12px 0 4px}.login .card{text-align:right;margin-top:18px}
table.gt{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}.gt th{background:var(--brand);color:#fff;text-align:right;padding:8px 10px}.gt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:10px}@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.toast{position:fixed;inset-inline:0;bottom:16px;display:flex;justify-content:center;z-index:80;pointer-events:none}.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px}
input[type=date],input[type=time],input[type=file]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:right;display:block}input[type=date]::-webkit-date-and-time-value{text-align:right}

/* ===== design pass: light, green header, floating cards ===== */
:root{--bg:#F2F5F4;--surface:#fff;--ink:#0E2A2C;--muted:#6B8284;--line:#E3EBEA;--brand:#0F7C93;--g:#4DB968;--soft:#E3F1F4;--font:Cairo,system-ui,sans-serif;--disp:Cairo,system-ui,sans-serif;color-scheme:light;--sh:0 2px 10px rgba(14,42,44,.07)}
body{font-weight:500;font-size:15.5px}
header.top{background:linear-gradient(135deg,#4DB968,#0F7C93);padding-bottom:6px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,124,147,.18)}
.hrow h1{font-weight:800}.hrow img{width:42px;height:42px}
nav button{font-weight:600;opacity:.8;border-radius:12px 12px 0 0}nav button[aria-selected=true]{opacity:1;border-bottom-color:#F2B21A}
h2{font-weight:800;color:var(--ink);font-size:1.02rem}
.card,.item{border:0;border-radius:18px;box-shadow:var(--sh)}
.chip{border-radius:999px}.go{border-radius:14px}input,select,textarea{border-radius:14px}
.tag{background:var(--soft)}
main{padding-top:0}
.hhero{margin:0 -4px}.hhi{font-size:1.35rem;font-weight:800;line-height:1.35;padding:18px 4px 12px;color:var(--ink)}.hhi span{display:block;font-size:.86rem;font-weight:500;color:var(--muted)}
.hs{position:relative;height:196px;border-radius:22px;overflow:hidden;box-shadow:0 10px 28px rgba(14,42,44,.2);background:#0B3E52}
.hs-empty{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:linear-gradient(135deg,#E3F1F4,#E6F4EA);color:var(--ink);box-shadow:var(--sh)}.hs-empty span{color:var(--muted);font-size:.86rem}
.htrack{display:flex;height:100%}
.hsl{height:100%;position:relative;color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hsl>svg,.hsl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hsl::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.66),rgba(0,0,0,0) 62%)}
.hsl>.hst,.hsl>h3,.hsl>p{position:relative;z-index:2}
.hst{align-self:flex-start;font-weight:800;font-size:.8rem;border-radius:999px;padding:1px 12px;color:#17211F}.hsl h3{font-size:1.08rem;font-weight:800;margin:6px 0 0;line-height:1.35}.hsl p{font-size:.8rem;opacity:.93;margin:0}
.hdots{position:absolute;bottom:10px;left:14px;display:flex;gap:5px;z-index:5}.hdots i{width:6px;height:6px;border-radius:9px;background:#fff;opacity:.5}
.live{position:absolute;top:12px;right:12px;z-index:5;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px}.live i{width:8px;height:8px;border-radius:50%;background:#FF5A4D;animation:hpu 1.4s infinite}
@keyframes hpu{0%{box-shadow:0 0 0 0 rgba(255,90,77,.7)}100%{box-shadow:0 0 0 9px rgba(255,90,77,0)}}
.hsec{margin-top:20px;display:flex;flex-direction:column;gap:8px}.hsec>h2{display:flex;justify-content:space-between}
.hrings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hr{background:var(--surface);border-radius:20px;padding:12px 4px 10px;text-align:center;box-shadow:var(--sh)}
.hr svg{width:72px;height:72px;transform:rotate(-90deg)}.hr circle{fill:none;stroke-width:9;stroke-linecap:round}.hr .bg{stroke:var(--line)}.hr .fg{stroke-dasharray:201;stroke-dashoffset:var(--off)}
.hanim .hr .fg{animation:hfill 1.5s .2s backwards cubic-bezier(.2,.7,.2,1)}@keyframes hfill{from{stroke-dashoffset:201}}
.hn{margin-top:-52px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem}.hr small{display:block;color:var(--muted);font-size:.74rem;margin-top:12px;line-height:1.25;padding:0 4px}
.ht{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.hic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}.hic svg{width:22px;height:22px}
.hx{min-width:0;flex:1}.hx b{display:block;font-weight:700;line-height:1.35}.hx span{color:var(--muted);font-size:.84rem;display:block;overflow-wrap:anywhere}
.hgo{font:inherit;background:var(--soft);color:var(--brand);border:0;border-radius:999px;padding:3px 16px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:38px}.hgo:empty{display:none}
.hstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.hph{flex:none;width:140px;height:100px;border-radius:16px;position:relative;overflow:hidden;scroll-snap-align:start;background:var(--soft)}
.hph img{width:100%;height:100%;object-fit:cover}.hph em{position:absolute;bottom:0;inset-inline:0;padding:14px 8px 5px;color:#fff;font-style:normal;font-size:.72rem;font-weight:700;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.htiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.htl{font:inherit;background:var(--surface);border:0;border-radius:16px;padding:12px 2px 9px;text-align:center;font-size:.78rem;font-weight:600;box-shadow:var(--sh);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:76px;line-height:1.25}
.htl svg{width:26px;height:26px;color:var(--brand)}
.hconf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}.hconf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:hfall 2.8s linear forwards}
@keyframes hfall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.hanim .hr .fg,.htrack,.hdots i{animation:none!important}}

/* ===== menu drawer, header, lists cards, idea slides ===== */
nav{display:none}
header.top{padding-bottom:14px}
.hrow{gap:10px}.hrow h1{flex:1;min-width:0;font-size:1.05rem;line-height:1.25}.hrow h1 small{margin-top:1px}
.burger{font:inherit;color:#fff;background:rgba(255,255,255,.2);border:0;border-radius:14px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none}.burger svg{width:26px;height:26px}
.bd{position:absolute;top:-4px;left:-4px;background:#E8782A;color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
#drw{position:fixed;inset:0;z-index:100;visibility:hidden;transition:visibility 0s .3s}#drw.open{visibility:visible;transition:none}
.dov{position:absolute;inset:0;background:rgba(14,42,44,.5);opacity:0;transition:opacity .28s}#drw.open .dov{opacity:1}
.dpanel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(320px,86vw);background:#fff;border-radius:0 0 0 0;border-start-start-radius:0;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;border-radius:24px 0 0 24px}
#drw.open .dpanel{transform:none}
.dme{padding:calc(22px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,#4DB968,#0F7C93);color:#fff;display:flex;gap:12px;align-items:center;border-radius:24px 0 0 0}.dme img{width:48px;height:48px;border-radius:50%;border:2px solid #fff}.dme b{display:block;font-weight:800}.dme small{opacity:.92}
.dlist{padding:8px 0;display:flex;flex-direction:column}.dsep{height:1px;background:var(--line);margin:2px 18px}
.dmi{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:56px;cursor:pointer;text-align:start;width:100%}

async function gSaveItem(d,send){
  const idea=!!d.idea,old=d.id?gget(d.id):null,c=gcy(),f=gread();
  if(!idea&&!c)return say('#gm','لا توجد دورة مفتوحة','err');
  if(send&&(!f.project||!f.template||!f.text||!f.source))return say('#gm','المشروع والقالب والنص والمصدر مطلوبة للإرسال','err');
  if(f.link&&!/^https?:\/\//.test(f.link))return say('#gm','الرابط يجب أن يبدأ بـ https://','err');
  if(f.project&&gprj().stopped.includes(f.project))return say('#gm','هذا المشروع متوقف، لا جرافيك له','err');
  if(!idea&&f.template){const n=S.gi.filter(x=>x.uid===S.me.id&&x.kind==='weekly'&&x.cycle===c.id&&x.template===f.template&&(!old||x.id!==old.id)).length;if(n>=3)return say('#gm','لديك 3 مقترحات من هذا القالب بالفعل','err')}
  try{
    say('#gm','جارٍ الحفظ…');
    let img=old&&old.image_url||null;const fl=$('#g_img').files[0];if(fl)img=(await upload(fl)).url;
    const now=Date.now(),v=send?((old&&old.v||0)+1):(old&&old.v||0),vers=(old&&old.versions||[]).slice();
    if(send)vers.push({v,at:now,project:f.project,template:f.template,text:f.text,source:f.source,link:f.link,notes:f.notes});
    const row={...f,image_url:img,state:send?'submitted':'draft',v,versions:vers,submitted_at:send?now:(old&&old.submitted_at||null)};
    if(old)await ok(await sb.from('gitems').update(row).eq('id',old.id));
    else await ok(await sb.from('gitems').insert({...row,uid:S.me.id,author:S.me.name,kind:idea?'idea':'weekly',cycle:idea?null:c.id,slot:idea?null:+d.slot}));
    gClose();await refresh();gToast(send?'أُرسل للمراجعة':'حُفظت المسودة');
  }catch(e){say('#gm',errAr(e),'err')}
}

 ],

 ],

 ],

function gdView(){
  const k=ordKey(),qs=GQ_ALL.concat(GQ[k]||[]).sort((a,b)=>(GQ[k]||[]).includes(b)-(GQ[k]||[]).includes(a));
  const tabs=orderedTabs().map(t=>t[0]).filter(t=>GSEC[t]);

  const hd=back=>'<div class="card">'+(back?'<button class="chip" data-act="gdm" data-v="">→ دليل المنصة</button>':'')+'</div>';
  if(mode==='q'){
    const cats=['الكل',...new Set(qs.map(q=>q[0]))],f=S.gdF||'الكل';

  }
  if(mode==='s'){

  }
  return '<div class="card"><h2>دليل المنصة</h2><p class="hint">ابدأ من هنا لتفهم المنصة بسهولة.</p></div><button class="lq gbig" style="background:linear-gradient(135deg,#E8782A,#C4561A)" data-act="gdm" data-v="q"><span class="cpe">❓</span><b>أسئلة يسألها الزملاء</b><small>إجابات قصيرة وواضحة · '+qs.length+' سؤالاً</small></button><button class="lq gbig" style="background:linear-gradient(135deg,#0F7C93,#0B5F72)" data-act="gdm" data-v="s"><span class="cpe">🧭</span><b>أقسام المنصة وغرضها</b><small>ما هو كل قسم ولماذا أضفناه · '+tabs.length+' أقسام</small></button>';

/* ===== Phase 8: team productivity (osama, hassan, hamza only) ===== */
function pPeriod(mode,back){
  const t=lt(Date.now()),y=t.getUTCFullYear(),m=t.getUTCMonth(),d=t.getUTCDate(),H=2*3600e3;
  if(mode==='w'){const a=Date.UTC(y,m,d-((t.getUTCDay()+1)%7))-H-(back||0)*7*86400e3;return[a,a+7*86400e3]}
  const a=Date.UTC(y,m-(back||0),1)-H,b=Date.UTC(y,m-(back||0)+1,1)-H;return[a,b]
}
function pStat(u,r){
  const ins=x=>x!=null&&x>=r[0]&&x<r[1],pu=S.pu.filter(x=>x.by_id===u.id&&ins(+x.ts)),gi=S.gi.filter(x=>x.uid===u.id&&x.kind==='weekly');
  const sent=gi.filter(x=>ins(+x.submitted_at)),ok=gi.filter(x=>ins(+x.approved_at)),pb=gi.filter(x=>ins(+x.published_at)),
    id=(S.ideas||[]).filter(x=>x.by_id===u.id&&ins(+x.ts)),shot=Object.values(S.shot).filter(x=>x.by_id===u.id&&ins(Date.parse(x.at)));
  const projs=new Set(pu.map(x=>x.project)).size,img=pu.filter(x=>x.media&&x.media.url).length;
  return{u,sent:sent.length,ok:ok.length,pb:pb.length,id:id.length,pu:pu.length,img,projs,shot:shot.length,tot:sent.length+id.length+pu.length+shot.length,lists:{sent,ok,pb,id,pu}};
}
function prodView(){
  if(!PRODV())return '<div class="empty">غير متاح.</div>';
  const mode=S.prM||'w',R0=pPeriod(mode,0),R1=pPeriod(mode,1);
  const ppl=S.people.filter(p=>p.active!==false&&['writer','follower'].includes(p.role));
  if(S.prP){const u=ppl.find(x=>x.id===S.prP);if(u)return prodDetail(u,mode,R0)}
  const A=ppl.map(u=>pStat(u,R0)).sort((a,b)=>b.tot-a.tot),prev=ppl.reduce((a,u)=>a+pStat(u,R1).tot,0),tot=A.reduce((a,x)=>a+x.tot,0),mx=Math.max(1,...A.map(x=>x.tot));
  const ch=prev?Math.round((tot-prev)*100/prev):null,lab=mode==='w'?'الأسبوع':'الشهر';
  return '<div class="tg">'+[['w','هذا الأسبوع'],['m','هذا الشهر']].map(([k,t])=>'<button class="'+(mode===k?'on':'')+'" data-act="prm" data-v="'+k+'">'+t+'</button>').join('')+'</div>'+
  '<div class="psm"><div><strong>'+tot+'</strong>عملاً مسجّلاً</div><div><strong>'+(ch==null?'—':(ch>0?'+':'')+ch+'%')+'</strong>عن '+lab+' الماضي</div></div>'+
  '<p class="hint">يُحسب ما سُجّل داخل المنصة فقط (مقترحات، أفكار، تحديثات). العمل خارجها لا يظهر.</p>'+
  (A.length?A.map(x=>{const w=x.u.role==='writer';return '<button class="pp" data-act="prp" data-v="'+x.u.id+'"><div class="top2"><b>'+esc(x.u.name)+'</b><span class="hint">'+(w?'كاتب':'متابع')+'</span></div><div class="pk">'+
   (w?'<div><strong>'+x.sent+'</strong><span>مقترح مُرسل</span></div><div><strong>'+x.ok+'</strong><span>معتمد</span></div><div><strong>'+x.id+'</strong><span>أفكار برامج</span></div>':'<div><strong>'+x.pu+'</strong><span>تحديث مشروع</span></div><div><strong>'+x.projs+'</strong><span>مشروعاً مختلفاً</span></div><div><strong>'+x.id+'</strong><span>أفكار برامج</span></div>')+
   '</div><div class="pbar"><i style="width:'+Math.round(x.tot*100/mx)+'%"></i></div></button>'}).join(''):'<div class="empty">لا كتّاب أو متابعين بعد.</div>');
}
function prodDetail(u,mode,R0){
  const x=pStat(u,R0),w=u.role==='writer',lab=mode==='w'?'هذا الأسبوع':'هذا الشهر';
  const bars=[3,2,1,0].map(b=>{const r=pPeriod(mode,b);return{b,t:pStat(u,r).tot}}),mx=Math.max(1,...bars.map(z=>z.t));
  const feed=[];x.lists.sent.forEach(i=>feed.push([+i.submitted_at,'اقترح «'+(i.template||i.project||'مقترح')+'»'+(i.status?' ← '+({approved:'معتمد',rejected:'مرفوض',published:'منشور',revise:'مطلوب تعديل'}[i.status]||i.status):'')]));
  x.lists.pu.forEach(i=>feed.push([+i.ts,'تحديث: '+i.project+' · '+i.status]));x.lists.id.forEach(i=>feed.push([+i.ts,'فكرة '+(i.kind==='reel'?'ريل':'برنامج')+': '+String(i.text||'').slice(0,40)]));
  feed.sort((a,b)=>b[0]-a[0]);
  const kp=w?[['مقترح مُرسل',x.sent],['معتمد',x.ok],['منشور',x.pb]]:[['تحديث مشروع',x.pu],['بصور',x.img],['مشروعاً مختلفاً',x.projs]];
  return '<div class="card"><button class="chip" data-act="prp" data-v="">→ كل الفريق</button><h2>'+esc(u.name)+' · '+lab+'</h2></div><div class="pk pk3">'+kp.map(k=>'<div><strong>'+k[1]+'</strong><span>'+k[0]+'</span></div>').join('')+'</div>'+
  '<div class="card"><h2>آخر 4 '+(mode==='w'?'أسابيع':'أشهر')+'</h2><div class="pch">'+bars.map(z=>'<div><i style="height:'+Math.round(z.t*100/mx)+'%"></i><b>'+z.t+'</b><span>'+(z.b===0?'الحالي':'−'+z.b)+'</span></div>').join('')+'</div></div>'+
  '<div class="card"><h2>نشاطه</h2>'+(feed.length?feed.slice(0,12).map(f=>'<div class="top2" style="border-top:1px solid var(--line);padding:6px 0"><span>'+esc(f[1])+'</span><span class="hint">'+esc(fdt(f[0]))+'</span></div>').join(''):'<p class="hint">لا نشاط في هذه الفترة.</p>')+'</div>';
}
Object.assign(ACT,{prm:d=>{S.prM=d.v;render()},prp:d=>{S.prP=d.v||null;render();scrollTo(0,0)}});
ACT.lgrp=d=>{S.lg=d.v;render()};ACT.menu=()=>{const d=$('#drw');if(d)d.classList.toggle('open')};

document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){S.tab=t.dataset.tab;S._hanim=0;document.body.classList.remove('hanim');render();return}const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t.dataset,t,e)}});
boot();
